[package]
name = "polka-core"
description = "Ядро «Полки»: книги, фильмы и сериалы, каталоги и обложки, зашифрованная база"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Общий модуль kit: протокол коннектора для Claude, формат резервной копии (https://github.com/primus-fixer/kit).
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "6d19930282973c7fbae0aa240a27baedc91530b1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "0.3"
# Резервные копии: ключ из пароля (Argon2id) и шифрование кусками (XChaCha20-Poly1305), как в «Кармане».
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
# Связь по Wi-Fi: ключ из кода (SPAKE2) и подписи (BLAKE2b), как в «Кармане».
blake2 = "0.10"
spake2 = "0.4"
# Облако: файлы событий сжимаются перед шифрованием, как в «Кармане».
miniz_oxide = "0.8"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Читалка: EPUB — архив ZIP с XHTML, FB2 — XML (бывает в windows-1251 и в .fb2.zip).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
encoding_rs = "0.8.44"
# PDF: из файла — только название, автор и число страниц; страницы рисует pdf.js в интерфейсе.
lopdf = { version = "0.47", default-features = false }

[dev-dependencies]
tempfile = "3"
