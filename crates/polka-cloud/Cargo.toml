[package]
name = "polka-cloud"
description = "Облако «Полки»: Яндекс Диск и свой сервер по WebDAV — вход и файлы"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Имитация сервера WebDAV — для проверок и сквозных тестов.
mock = []

[dependencies]
base64 = "0.22"
polka-core = { path = "../polka-core" }
# Облако «Полки» — по формату и обмену из общего модуля kit (https://github.com/primus-fixer/kit).
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "ad91b1bef6421e1776993617ae5e275b50417dc3" }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
