[package]
name = "polka-cloud"
description = "Облако «Полки»: Яндекс Диск и свой сервер по WebDAV — вход и файлы"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Имитация сервера WebDAV — для проверок и сквозных тестов.
mock = ["kit-cloud/mock"]

[dependencies]
polka-core = { path = "../polka-core" }
# Облако «Полки» — формат, обмен и клиент WebDAV из общего модуля kit (https://github.com/primus-fixer/kit).
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "326f7aa5623a0ea38122a3bc2650682896536c86" }
kit-cloud = { git = "https://github.com/primus-fixer/kit", rev = "326f7aa5623a0ea38122a3bc2650682896536c86" }

[dev-dependencies]
kit-cloud = { git = "https://github.com/primus-fixer/kit", rev = "326f7aa5623a0ea38122a3bc2650682896536c86", features = ["mock"] }
serde_json = "1"
tempfile = "3"
