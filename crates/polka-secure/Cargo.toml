[package]
name = "polka-secure"
description = "Ключ базы «Полки» в хранилище системы и проверка личности: DPAPI и Windows Hello, Android Keystore"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_WinRT",
] }
windows-future = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
