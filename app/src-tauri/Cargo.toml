[package]
name = "polka-app"
description = "Полка — прочитанные книги, просмотренные фильмы и сериалы"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "polka_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
polka-core = { path = "../../crates/polka-core" }
polka-secure = { path = "../../crates/polka-secure" }
# Связь по Wi-Fi: адреса устройства в сети и QR-код со своим адресом и кодом связи.
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Камера для штрихкода книги — только на телефоне.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Выбор папки для резервных копий — окно системы (только на компьютере).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
