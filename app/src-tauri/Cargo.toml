[package]
name = "polka-app"
description = "Полка — прочитанные книги, просмотренные фильмы и сериалы"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "polka_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
polka-cloud = { path = "../../crates/polka-cloud" }
polka-core = { path = "../../crates/polka-core" }
# Общий модуль kit 0.9.0: ключ базы в хранилище системы, PIN-код и вход
# (https://github.com/primus-fixer/kit). Ссылка — на коммит версии; когда у kit появится метка
# v0.9.0, `rev` заменяется на `tag = "v0.9.0"`.
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "0e24907e8d477f356f2db5c8c35ed601bf8c5622" }
kit-secure = { git = "https://github.com/primus-fixer/kit", rev = "0e24907e8d477f356f2db5c8c35ed601bf8c5622" }
kit-tauri = { git = "https://github.com/primus-fixer/kit", rev = "0e24907e8d477f356f2db5c8c35ed601bf8c5622" }
# Страница Яндекс ID, где создают пароль приложения для Диска.
tauri-plugin-opener = "2"
# Связь по Wi-Fi: адреса устройства в сети и QR-код со своим адресом и кодом связи.
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Камера для штрихкода книги — только на телефоне.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
# Вход по отпечатку.
tauri-plugin-biometric = "2"

# Выбор папки для резервных копий — окно системы (только на компьютере).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
# Второй запуск открывает уже работающую «Полку» — его делает и коннектор для Claude.
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
