name: Сборки

on:
  push:
  workflow_dispatch:

# Сборкам токен GitHub нужен только для чтения кода.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — установщик
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Ключ базы в хранилище Windows (DPAPI)
        run: cargo test -p polka-secure
      - name: Пакеты интерфейса
        run: npm ci
        working-directory: app
      - name: Сборка
        run: npm run tauri build
        working-directory: app
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: polka-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android — APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK и NDK
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platform-tools" > /dev/null
          NDK="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          BIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          # OpenSSL при сборке ищет aarch64-linux-android-ranlib, а в NDK есть только llvm-ranlib.
          echo "RANLIB_aarch64_linux_android=${BIN}/llvm-ranlib" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${BIN}/llvm-ar" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Пакеты интерфейса
        run: npm ci
        working-directory: app
      - name: Android-проект
        working-directory: app
        run: |
          if [ ! -d src-tauri/gen/android ]; then npm run tauri android init -- --ci; fi
          bash ../scripts/android-patch.sh src-tauri/gen/android src-tauri/icons/android
      # Ключ подписи — только в шаге подписи: компилятор и пакеты сборки его не видят.
      - name: Есть ли ключ подписи
        id: keys
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: echo "signed=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - name: Сборка APK
        working-directory: app
        env:
          SIGNED: ${{ steps.keys.outputs.signed }}
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          OUTPUTS=src-tauri/gen/android/app/build/outputs/apk
          if [ "$SIGNED" = "true" ]; then
            # Выпускная сборка: подпишем постоянным ключом в следующем шаге — обновления ставятся поверх.
            npm run tauri android build -- --apk --target aarch64
            APK=$(find "$OUTPUTS" -name '*-release*.apk' | head -1)
            if [ -z "$APK" ]; then echo "Не найден APK для подписи"; find "$OUTPUTS" -name '*.apk'; exit 1; fi
            cp "$APK" "$RUNNER_TEMP/unsigned.apk"
          else
            # Без ключа — отладочная сборка: её подпись меняется от сборки к сборке.
            npm run tauri android build -- --debug --apk --target aarch64
            APK=$(find "$OUTPUTS" -name '*.apk' | head -1)
            cp "$APK" "out/Polka-$VERSION-debug.apk"
            echo "::warning::Нет секретов ANDROID_KEYSTORE и ANDROID_KEYSTORE_PASSWORD — собрана отладочная версия. Перед её установкой старую версию придётся удалить."
          fi
      - name: Подпись APK
        if: steps.keys.outputs.signed == 'true'
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Псевдоним ключа: polka, если не задан секретом (например, karman — ключ «Кармана»).
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/polka.jks"
          trap 'rm -f "$RUNNER_TEMP/polka.jks"' EXIT
          "$BT/zipalign" -P 16 -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk" || "$BT/zipalign" -p -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/polka.jks" --ks-key-alias "${KEY_ALIAS:-polka}" \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --v4-signing-enabled false \
            --out "out/Polka-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/Polka-$VERSION.apk"
          ls -la out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: polka-android
          path: app/out/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Android-проект для разбора
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-project
          path: |
            app/src-tauri/gen/android
            !app/src-tauri/gen/android/**/build/**
            !app/src-tauri/gen/android/**/jniLibs/**
            !app/src-tauri/gen/android/.gradle/**
          if-no-files-found: ignore
          retention-days: 3
