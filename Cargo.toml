[workspace]
resolver = "2"
members = ["crates/polka-core", "crates/polka-cloud", "crates/polka-secure", "app/src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2021"
publish = false

[profile.release]
strip = true

# Шифрование базы в отладочной сборке иначе заметно тормозит.
[profile.dev.package.sha2]
opt-level = 3
